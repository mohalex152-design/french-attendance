<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الحضور</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="logo">🇫🇷 French Attendance</div><nav><a href="index.html">الرئيسية</a></nav></header>
<main class="wrap narrow"><section class="panel">
<h1>تسجيل الحضور ✅</h1><p class="muted">اكتب اسمك مرة واحدة اليوم.</p>
<form id="form"><label>اسم الطالب</label><input id="name" maxlength="60" required placeholder="اكتب اسمك هنا"><button class="btn full">تسجيل الحضور</button></form>
<div id="msg"></div></section></main>
<script>
const SUPABASE_URL="https://vjqpsftfkoydahinhrbs.supabase.co";
const SUPABASE_KEY="sb_publishable_0tLGXQ6XwJCKRBQltE1UkA_Lv7VOnJ2";
const form=document.getElementById("form"), msg=document.getElementById("msg");
form.addEventListener("submit",async e=>{
 e.preventDefault(); msg.className=""; msg.textContent="جاري التسجيل...";
 const name=document.getElementById("name").value.trim();
 const res=await fetch(SUPABASE_URL+"/rest/v1/attendance",{
  method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
  body:JSON.stringify({student_name:name})
 });
 if(res.ok){msg.className="success";msg.textContent="تم تسجيل حضورك بنجاح ✅";form.reset();}
 else {let t=await res.text(); if(res.status===409||t.includes("duplicate")){msg.className="success";msg.textContent="الحضور مسجل بالفعل اليوم ✅";}else{msg.className="error";msg.textContent="حصلت مشكلة أثناء التسجيل. تأكد من الإنترنت ثم حاول مرة أخرى.";}}
});
</script>
</body></html>
