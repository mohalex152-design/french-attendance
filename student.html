<!doctype html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>تسجيل الحضور 🇫🇷</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<header>

    <div class="logo">
        🇫🇷 French Attendance
    </div>

    <nav>

        <a href="index.html">
            الرئيسية
        </a>

    </nav>

</header>



<main class="wrap narrow">

    <section class="panel">

        <h1>
            تسجيل الحضور ✅
        </h1>

        <p class="muted">
            اكتب اسمك لتسجيل حضورك اليوم.
        </p>


        <form id="form">

            <label for="name">
                اسم الطالب
            </label>

            <input
                id="name"
                type="text"
                maxlength="60"
                autocomplete="name"
                placeholder="اكتب اسمك هنا"
                required
            >


            <button
                class="btn full"
                type="submit"
                id="submitBtn"
            >
                تسجيل الحضور
            </button>

        </form>


        <div id="msg"></div>

    </section>

</main>



<script>



const SUPABASE_URL =
    "https://vjqpsftfkoydahinhrbs.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_0tLGXQ6XwJCKRBQltE1UkA_Lv7VOnJ2";





const form =
    document.getElementById("form");

const nameInput =
    document.getElementById("name");

const msg =
    document.getElementById("msg");

const submitBtn =
    document.getElementById("submitBtn");




form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            nameInput.value.trim();


      

        if (!name) {

            msg.className = "error";

            msg.textContent =
                "من فضلك اكتب اسمك أولًا ❌";

            return;

        }




        submitBtn.disabled = true;

        submitBtn.textContent =
            "جاري التسجيل...";


        msg.className = "";

        msg.textContent =
            "جاري تسجيل حضورك...";


        try {


          
         

            const response =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/attendance",

                    {

                        method: "POST",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=minimal"

                        },


                        body: JSON.stringify({

                            student_name: name

                        })

                    }

                );



            if (response.ok) {

                msg.className =
                    "success";

                msg.textContent =
                    "تم تسجيل حضورك بنجاح ✅🇫🇷";


                nameInput.value = "";


                return;

            }




            const errorText =
                await response.text();



      

            if (
                response.status === 409 ||
                errorText.includes("duplicate") ||
                errorText.includes("unique")
            ) {

                msg.className =
                    "success";

                msg.textContent =
                    "الحضور مسجل بالفعل اليوم ✅";

            }

            else {

                console.error(
                    errorText
                );

                msg.className =
                    "error";

                msg.textContent =
                    "حدثت مشكلة أثناء التسجيل ❌";

            }


        }

        catch (error) {

            console.error(error);

            msg.className =
                "error";

            msg.textContent =
                "تأكد من اتصال الإنترنت وحاول مرة أخرى ❌";

        }


        finally {

            submitBtn.disabled = false;

            submitBtn.textContent =
                "تسجيل الحضور";

        }

    }
);


</script>


</body>

</html>
