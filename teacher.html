<!doctype html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>لوحة المدرس - French Attendance</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- حماية لوحة المدرس -->

<script>

if (
    sessionStorage.getItem("teacherLoggedIn") !== "1" &&
    localStorage.getItem("teacherRemembered") !== "1"
) {

    window.location.replace("login.html");

}

</script>


<header>

    <div class="logo">
        🇫🇷 French Attendance
    </div>


    <nav>

        <a href="index.html">
            الرئيسية
        </a>


        <a href="#" onclick="logout(); return false;">
            تسجيل خروج 🔒
        </a>

    </nav>

</header>



<main class="wrap">

<section class="panel">


    <!-- العنوان -->

    <div class="head">

        <div>

            <h1>
                لوحة المدرس 📊
            </h1>

            <p class="muted">

                📅 تاريخ الحضور:
                <b id="todayDate"></b>

            </p>

        </div>


        <button
            class="btn"
            onclick="window.print()">

            🖨️ طباعة QR

        </button>

    </div>



    <!-- QR الطالب -->

    <div class="qr">

        <div id="qrcode"></div>

        <p>
            📱 امسح الكود لفتح صفحة الطالب
        </p>

    </div>



    <!-- عدد الحاضرين -->

    <div class="stat">

        <b id="count">
            0
        </b>

        <span>
            حاضر اليوم
        </span>

    </div>



    <!-- إضافة طالب -->

    <div class="card" style="margin-bottom:20px;">

        <h2>
            ➕ إضافة طالب يدويًا
        </h2>

        <p class="muted">
            لو الطالب معهوش موبايل، يمكنك تسجيل حضوره من هنا.
        </p>


        <form id="addStudentForm">

            <label>
                اسم الطالب
            </label>


            <input
                type="text"
                id="manualStudentName"
                maxlength="60"
                required
                placeholder="اكتب اسم الطالب"
            >


            <button
                type="submit"
                class="btn full"
                id="addStudentBtn">

                ➕ إضافة الطالب

            </button>

        </form>


        <div id="addMessage"></div>

    </div>



    <!-- الحاضرون -->

    <div class="head">

        <h2>
            الحاضرون اليوم
        </h2>


        <button
            class="danger"
            onclick="clearToday()">

            🗑️ مسح حضور اليوم

        </button>

    </div>



    <!-- جدول الحضور -->

    <div class="tablewrap">

        <table>

            <thead>

                <tr>

                    <th>
                        #
                    </th>

                    <th>
                        الاسم
                    </th>

                    <th>
                        الوقت
                    </th>

                    <th>
                        الحالة
                    </th>

                    <th>
                        حذف
                    </th>

                </tr>

            </thead>


            <tbody id="rows">

            </tbody>

        </table>

    </div>


</section>

</main>



<!-- QR Library -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>



<script>


/* ==========================
   Supabase
========================== */

const SUPABASE_URL =
    "https://vjqpsftfkoydahinhrbs.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_0tLGXQ6XwJCKRBQltE1UkA_Lv7VOnJ2";



/* ==========================
   التاريخ
========================== */

function getTodayDate() {

    const now = new Date();


    const day =
        String(now.getDate())
        .padStart(2, "0");


    const month =
        String(now.getMonth() + 1)
        .padStart(2, "0");


    const year =
        now.getFullYear();


    return day + "/" + month + "/" + year;

}



function getDatabaseDate() {

    const now = new Date();


    const year =
        now.getFullYear();


    const month =
        String(now.getMonth() + 1)
        .padStart(2, "0");


    const day =
        String(now.getDate())
        .padStart(2, "0");


    return year + "-" + month + "-" + day;

}



document.getElementById("todayDate")
    .textContent =
    getTodayDate();



/* ==========================
   QR Code
========================== */

/*
   مهم:
   الـQR يفتح student.html فقط
*/

const studentUrl =
    new URL(
        "student.html",
        window.location.href
    ).toString();


document.getElementById("qrcode")
    .innerHTML = "";


new QRCode(
    document.getElementById("qrcode"),
    {

        text: studentUrl,

        width: 240,

        height: 240

    }
);



/* ==========================
   تحميل الحضور
========================== */

async function loadAttendance() {


    const today =
        getDatabaseDate();


    try {


        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/attendance" +

                "?select=id,student_name,attendance_time,status" +

                "&attendance_date=eq." +
                today +

                "&order=attendance_time.asc",

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );



        if (!response.ok) {

            throw new Error(
                "حدث خطأ في تحميل الحضور"
            );

        }



        const data =
            await response.json();



        document.getElementById("count")
            .textContent =
            data.length;



        const rows =
            document.getElementById("rows");


        rows.innerHTML = "";



        data.forEach(
            (student, index) => {


                const tr =
                    document.createElement("tr");



                /* الرقم */

                const number =
                    document.createElement("td");

                number.textContent =
                    index + 1;



                /* الاسم */

                const name =
                    document.createElement("td");

                name.textContent =
                    student.student_name;



                /* الوقت */

                const time =
                    document.createElement("td");

                time.textContent =
                    new Date(
                        student.attendance_time
                    ).toLocaleTimeString(
                        "ar-EG",
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );



                /* الحالة */

                const status =
                    document.createElement("td");

                status.textContent =
                    "🟢 حاضر";



                /* زر الحذف */

                const deleteCell =
                    document.createElement("td");


                const deleteButton =
                    document.createElement("button");


                deleteButton.className =
                    "danger";


                deleteButton.textContent =
                    "🗑️ حذف";


                deleteButton.onclick =
                    function() {

                        deleteStudent(
                            student.id
                        );

                    };



                deleteCell.appendChild(
                    deleteButton
                );



                tr.appendChild(number);

                tr.appendChild(name);

                tr.appendChild(time);

                tr.appendChild(status);

                tr.appendChild(deleteCell);


                rows.appendChild(tr);

            }
        );


    } catch (error) {

        console.error(error);

    }

}



/* ==========================
   إضافة طالب يدويًا
========================== */

document
    .getElementById("addStudentForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const input =
                document.getElementById(
                    "manualStudentName"
                );


            const button =
                document.getElementById(
                    "addStudentBtn"
                );


            const message =
                document.getElementById(
                    "addMessage"
                );


            const name =
                input.value.trim();



            if (!name) {

                message.className =
                    "error";

                message.textContent =
                    "اكتب اسم الطالب أولًا ❌";

                return;

            }



            button.disabled = true;

            button.textContent =
                "جاري الإضافة...";



            message.className = "";

            message.textContent =
                "جاري إضافة الطالب...";



            try {


                const response =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/attendance",

                        {

                            method: "POST",

                            headers: {

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    "Bearer " +
                                    SUPABASE_KEY,

                                "Content-Type":
                                    "application/json",

                                "Prefer":
                                    "return=minimal"

                            },


                            body:
                            JSON.stringify({

                                student_name:
                                    name,

                                attendance_date:
                                    getDatabaseDate()

                            })

                        }

                    );



                if (response.ok) {


                    message.className =
                        "success";


                    message.textContent =
                        "تم إضافة الطالب بنجاح ✅";


                    input.value = "";


                    loadAttendance();


                } else {


                    const errorText =
                        await response.text();


                    console.error(
                        errorText
                    );


                    message.className =
                        "error";


                    message.textContent =
                        "لم تتم إضافة الطالب ❌";

                }


            } catch (error) {


                console.error(error);


                message.className =
                    "error";


                message.textContent =
                    "حدث خطأ في الاتصال ❌";

            }



            button.disabled = false;

            button.textContent =
                "➕ إضافة الطالب";

        }
    );



/* ==========================
   حذف طالب واحد
========================== */

async function deleteStudent(id) {


    const confirmed =
        confirm(
            "هل تريد حذف حضور هذا الطالب؟"
        );


    if (!confirmed) {

        return;

    }



    try {


        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/attendance?id=eq." +
                id,

                {

                    method: "DELETE",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );



        if (response.ok) {


            alert(
                "تم حذف الطالب بنجاح ✅"
            );


            loadAttendance();


        } else {


            alert(
                "لم يتم حذف الطالب ❌"
            );

        }


    } catch (error) {


        console.error(error);


        alert(
            "حدث خطأ أثناء الحذف ❌"
        );

    }

}



/* ==========================
   مسح حضور اليوم
========================== */

async function clearToday() {


    const confirmed =
        confirm(
            "هل تريد مسح حضور اليوم بالكامل؟"
        );


    if (!confirmed) {

        return;

    }



    const today =
        getDatabaseDate();



    try {


        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/attendance" +

                "?attendance_date=eq." +
                today,

                {

                    method: "DELETE",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );



        if (response.ok) {


            alert(
                "تم مسح حضور اليوم بنجاح ✅"
            );


            loadAttendance();


        } else {


            alert(
                "لم يتم مسح الحضور ❌"
            );

        }


    } catch (error) {


        console.error(error);


        alert(
            "حدث خطأ في الاتصال بقاعدة البيانات ❌"
        );

    }

}



/* ==========================
   تسجيل الخروج
========================== */

function logout() {


    sessionStorage.removeItem(
        "teacherLoggedIn"
    );


    localStorage.removeItem(
        "teacherRemembered"
    );


    window.location.replace(
        "login.html"
    );

}



/* ==========================
   تشغيل
========================== */

loadAttendance();



/* تحديث القائمة كل 5 ثواني */

setInterval(
    loadAttendance,
    5000
);



/* تحديث التاريخ */

setInterval(
    function() {

        document.getElementById(
            "todayDate"
        ).textContent =
            getTodayDate();

    },
    60000
);

</script>


</body>

</html>
