<!doctype html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        دخول المدرس - French Attendance
    </title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<header>

    <div class="logo">
        🇫🇷 French Attendance
    </div>

    <nav>

        <a href="index.html">
            الرئيسية
        </a>

    </nav>

</header>



<main class="wrap narrow">

    <section class="panel">

        <h1>
            🔐 لوحة المدرس
        </h1>

        <p class="muted">
            اكتب كلمة السر للدخول إلى قائمة الحضور.
        </p>


        <form id="loginForm">

            <label for="password">
                كلمة السر
            </label>

            <input
                id="password"
                type="password"
                placeholder="اكتب كلمة السر"
                required
            >


            <label class="remember">

                <input
                    id="remember"
                    type="checkbox"
                >

                تذكرني

            </label>


            <button
                class="btn full"
                type="submit"
            >

                دخول

            </button>

        </form>


        <div id="message"></div>

    </section>

</main>



<script>

    // كلمة سر المدرس
    const PASSWORD = "A123a456#7";


    // لو اختار تذكرني قبل كده
    if (
        localStorage.getItem("teacherRemembered") === "1"
    ) {

        window.location.href = "teacher.html";

    }



    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const password =
                document.getElementById("password").value;


            const remember =
                document.getElementById("remember").checked;


            const message =
                document.getElementById("message");



            // التأكد من كلمة السر
            if (password === PASSWORD) {


                // تسجيل الدخول لهذه الجلسة
                sessionStorage.setItem(
                    "teacherLoggedIn",
                    "1"
                );


                // تذكر المدرس على نفس الجهاز
                if (remember) {

                    localStorage.setItem(
                        "teacherRemembered",
                        "1"
                    );

                }


                // فتح لوحة المدرس
                window.location.href =
                    "teacher.html";


            } else {


                message.className = "error";

                message.textContent =
                    "كلمة السر غير صحيحة ❌";

            }

        });

</script>


</body>

</html>
